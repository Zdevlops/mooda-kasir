name: Build MoodA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: HTML satu file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build single-file HTML
        run: node build-single.js

      - name: Upload MoodA-Single.html
        uses: actions/upload-artifact@v4
        with:
          name: MoodA-Single
          path: dist/MoodA-Single.html
          if-no-files-found: error
          retention-days: 90

  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Siapkan aset web
        run: npm run build:www

      - name: Tambah platform Android
        run: npx cap add android

      - name: Pasang plugin native (cetak Bluetooth + pembaruan aplikasi)
        run: |
          PKG=android/app/src/main/java/com/mooda/kasir
          mkdir -p "$PKG"
          cp native/plugin/MoodaPrinterPlugin.java "$PKG/"
          cp native/plugin/MoodaUpdater.java "$PKG/"
          cp native/plugin/MoodaUpdaterPlugin.java "$PKG/"
          cp native/plugin/MoodaApkProvider.java "$PKG/"
          cp native/plugin/MainActivity.java "$PKG/"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = p.read_text()
          perms = []
          if "BLUETOOTH_CONNECT" not in xml:
              perms += ["BLUETOOTH", "BLUETOOTH_ADMIN", "BLUETOOTH_CONNECT", "BLUETOOTH_SCAN"]
          if "REQUEST_INSTALL_PACKAGES" not in xml:
              perms += ["REQUEST_INSTALL_PACKAGES"]
          if perms:
              out = []
              for n in perms:
                  cap = ' android:maxSdkVersion="30"' if n in ("BLUETOOTH", "BLUETOOTH_ADMIN") else ""
                  out.append('    <uses-permission android:name="android.permission.%s"%s />' % (n, cap))
              xml = xml.replace("</manifest>", "\n".join(out) + "\n</manifest>")
          if "MoodaApkProvider" not in xml:
              provider = (
                  '        <provider\n'
                  '            android:name=".MoodaApkProvider"\n'
                  '            android:authorities="${applicationId}.apk"\n'
                  '            android:exported="false"\n'
                  '            android:grantUriPermissions="true" />\n'
              )
              xml = xml.replace("</application>", provider + "    </application>")
          p.write_text(xml)
          print("manifest: izin Bluetooth + pasang APK siap")
          PY

      - name: Samakan versi dengan package.json
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          version = json.loads(pathlib.Path("package.json").read_text())["version"]
          parts = [int(x) for x in re.findall(r"\d+", version)[:3]]
          while len(parts) < 3:
              parts.append(0)
          code = parts[0] * 10000 + parts[1] * 100 + parts[2]
          g = pathlib.Path("android/app/build.gradle")
          s = g.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode %d" % code, s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "%s"' % version, s, count=1)
          g.write_text(s)
          print("versi aplikasi:", version, "kode build:", code)
          PY

      - name: Sinkron aset ke Android
        run: npx cap sync android

      - name: Siapkan kunci rilis (supaya update tidak perlu uninstall)
        env:
          KEYSTORE_BASE64: ${{ secrets.MOODA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret MOODA_KEYSTORE_B64 belum diisi"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mooda-release.jks"
          echo "MOODA_KEYSTORE=$RUNNER_TEMP/mooda-release.jks" >> "$GITHUB_ENV"

      - name: Pasang signing config di build.gradle
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // Ditambahkan CI: blok android kedua sah di Groovy DSL.
          if (System.getenv("MOODA_KEYSTORE") != null) {
              android {
                  signingConfigs {
                      moodaRelease {
                          storeFile file(System.getenv("MOODA_KEYSTORE"))
                          storePassword System.getenv("MOODA_STORE_PASSWORD")
                          keyAlias System.getenv("MOODA_KEY_ALIAS")
                          keyPassword System.getenv("MOODA_KEY_PASSWORD")
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.moodaRelease
                      }
                  }
              }
          }
          GRADLE

      - name: Build APK (rilis, ditandatangani)
        env:
          MOODA_STORE_PASSWORD: ${{ secrets.MOODA_STORE_PASSWORD }}
          MOODA_KEY_ALIAS: ${{ secrets.MOODA_KEY_ALIAS }}
          MOODA_KEY_PASSWORD: ${{ secrets.MOODA_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Pastikan APK benar-benar ditandatangani
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoodA-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

  release:
    name: Rilis otomatis
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ambil APK
        uses: actions/download-artifact@v4
        with:
          name: MoodA-APK
          path: dist

      - name: Ambil HTML satu file
        uses: actions/download-artifact@v4
        with:
          name: MoodA-Single
          path: dist

      - name: Beri nama sesuai versi + sidik jari
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          version = json.loads(pathlib.Path("package.json").read_text())["version"]
          parts = [int(x) for x in re.findall(r"\d+", version)[:3]]
          while len(parts) < 3:
              parts.append(0)
          code = parts[0] * 10000 + parts[1] * 100 + parts[2]

          src = pathlib.Path("dist/app-release.apk")
          apk = pathlib.Path("dist/MoodA.apk")
          apk.write_bytes(src.read_bytes())
          src.unlink()

          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          pathlib.Path(str(apk) + ".sha256").write_text("%s  %s\n" % (digest, apk.name))

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("APP_VERSION=%s\n" % version)
              env.write("APP_CODE=%d\n" % code)
              env.write("APK_NAME=%s\n" % apk.name)
              env.write("APK_SHA=%s\n" % digest)
          print("rilis", version, "kode", code, digest)
          PY

      - name: Terbitkan rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MoodA ${{ env.APP_VERSION }}
          body: |
            ## MoodA Kasir ${{ env.APP_VERSION }}

            Aplikasi kasir kafe. Jalan offline, data tersimpan di perangkat.

            | Berkas | Untuk |
            |---|---|
            | **${{ env.APK_NAME }}** | Android. Unduh, buka, izinkan "instal dari sumber tidak dikenal" |
            | **MoodA-Single.html** | Windows / Mac / iPhone. Satu file, buka dengan browser |

            **Pembaruan otomatis:** aplikasi Android versi ini bisa memeriksa rilis terbaru
            dan memasang pembaruan sendiri dari halaman **Info → Pembaruan aplikasi**.

            **SHA-256** `${{ env.APK_NAME }}`

            ```
            ${{ env.APK_SHA }}
            ```

            <!-- mooda:versionCode=${{ env.APP_CODE }} -->
          files: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
            dist/MoodA-Single.html
          draft: false
          prerelease: false
          overwrite_files: true